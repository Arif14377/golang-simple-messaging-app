# Logstash: terima event dari Filebeat, parsing dua format log aplikasi,
# lalu kirim ke Elasticsearch.
#
# Format yang dikenali:
#   1. Access log Fiber      : [15:04:05] 127.0.0.1 200 - 1.234ms GET /dashboard -
#   2. Log stdlib Go         : 2026/11/02 04:00:42 Successfully to migrate database!

input {
  beats {
    port => 5044
  }
}

filter {
  # ---------- 1. Access log Fiber ----------
  grok {
    id => "fiber_access"
    match => {
      "message" => "^\[%{TIME:log_time}\] %{IPORHOST:client_ip} %{NUMBER:status_code:int} - %{DATA:latency_raw} %{WORD:http_method} %{NOTSPACE:path}(?: %{GREEDYDATA:http_error})?$"
    }
    tag_on_failure => ["_fiber_access_failed"]
  }

  if "_fiber_access_failed" not in [tags] {
    mutate {
      id => "fiber_access_fields"
      add_field => { "log_type" => "access" }
      remove_field => ["log_time"]
    }

    # Fiber menulis "-" saat tidak ada error.
    if [http_error] == "-" {
      mutate {
        id => "drop_empty_http_error"
        remove_field => ["http_error"]
      }
    }

    # Normalisasi latency ke milidetik; Fiber bisa memakai ms, µs, atau s.
    ruby {
      id => "latency_to_ms"
      code => '
        raw = event.get("latency_raw")
        if raw
          value = raw.to_f
          if raw.end_with?("µs")
            value = value / 1000.0
          elsif raw.end_with?("s") && !raw.end_with?("ms")
            value = value * 1000.0
          end
          event.set("latency_ms", value)
          event.remove("latency_raw")
        end
      '
    }
  } else {
    mutate {
      id => "clear_fiber_failure_tag"
      remove_tag => ["_fiber_access_failed"]
    }

    # ---------- 2. Log aplikasi dari stdlib log ----------
    grok {
      id => "go_stdlib"
      match => {
        "message" => "^(?<go_timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) (?<app_message>.*)$"
      }
      tag_on_failure => ["_go_stdlib_failed"]
    }

    if "_go_stdlib_failed" not in [tags] {
      mutate {
        id => "go_stdlib_fields"
        add_field => { "log_type" => "app" }
      }

      # Timestamp log Go tidak membawa offset, jadi timezone diambil dari env
      # LOG_TIMEZONE (lihat docker-compose.yml).
      date {
        id => "go_stdlib_timestamp"
        match => ["go_timestamp", "yyyy/MM/dd HH:mm:ss"]
        target => "@timestamp"
        timezone => "${LOG_TIMEZONE:Asia/Jakarta}"
        remove_field => ["go_timestamp"]
      }
    } else {
      mutate {
        id => "unknown_line"
        remove_tag => ["_go_stdlib_failed"]
        add_field => { "log_type" => "unknown" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Index harian; sederhana dan mudah dihapus untuk development.
    # Kibana data view: simple-messaging-*
    index => "simple-messaging-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }

  # Tetap tampilkan event di `docker compose logs -f logstash` untuk debugging.
  stdout {
    codec => rubydebug { metadata => false }
  }
}
